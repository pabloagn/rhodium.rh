# --- General ---
baseURL = "https://rhodium.solenoidlabs.com"
languageCode = "en-us"
title = "Rhodium"

# --- Build Settings ---
buildDrafts = false
buildFuture = false
buildExpired = false
enableGitInfo = true
enableRobotsTXT = true

# --- Permalinks ---
[permalinks]
"docs/*" = "/docs/:slug/"  # For section pages
"docs/**" = "/docs/:sections/:slug/"  # For regular pages
# docs = "/:sections/:slug/"
# "docs/**" = "/docs/:slug/"

# --- Output Formats ---
[outputs]
home = ["HTML", "RSS", "JSON"]
page = ["HTML", "Article"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

[mediaTypes]
[mediaTypes."text/html"]
baseName = "_content"
isPlainText = false
suffixes = ["html"]

[outputFormats]
[outputFormats.Article]
mediaType = "text/html"
baseName = "_content"
permalinkable = true

[pagination]
pagerSize = 12

[frontmatter]
lastmod = ["lastmod", ":git", ":fileModTime", ":default"]

# --- Menu Configuration ---
[menu]
[[menu.main]]
name = "Docs"
url = "/docs/"
weight = 10

[[menu.main]]
name = "About"
url = "/about/"
weight = 20

[[menu.main]]
name = "Contact"
url = "/contact/"
weight = 30

# --- Site Parameters ---
[params]
description = "Rhodium - A Hypermodular NixOS System"
author = "Pablo Aguirre"
email = "pablo.aguirre@solenoidlabs.com"
repoURL = "https://github.com/pabloagn/rhodium"

# --- Social Links ---
[params.social]
github = "pabloagn"
linkedin = "pablo-aguirre-nunez"

# --- Ajax Search Engine ---
[params.search]
types = ["docs"]

# --- Markup Configuration ---
[markup]

[markup.goldmark]

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions]
table = true
strikethrough = true
linkify = true
taskList = true

[markup.tableOfContents]
startLevel = 2
endLevel = 5
ordered = false

[markup.highlight]
lineNos = true
lineNumbersInTable = false
noClasses = false
codeFences = true
guessSyntax = true
tabWidth = 2
